[pytest]
# Python host/companion test suite (stdlib unittest cases, run by pytest).
# Run from the repository root:  python3 -m pytest
testpaths = tests
pythonpath = src tests
addopts = -q -p no:cacheprovider
timeout = 300
markers =
    netsim: multiplayer tests that run through the application-level network simulator
    multiclient: tests that start several simulated clients against one host
