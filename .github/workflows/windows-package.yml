            echo "the Windows game and the Linux symbol sizes are of different engine commits" >&2; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Private virtual environment with the pinned, hashed wheels
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --require-hashes --only-binary=:all: -r requirements-host-provisioning.txt
      - uses: actions/download-artifact@v8
        with:
          name: native-inputs
          path: inputs
      - uses: actions/download-artifact@v8
        with:
          name: mega-check-inputs
          path: mega-check-inputs
      - uses: actions/download-artifact@v8
        with:
          name: classic-pe-symbols
          path: symbols
      - uses: actions/download-artifact@v8
        with:
          name: classic-linux-sizes
