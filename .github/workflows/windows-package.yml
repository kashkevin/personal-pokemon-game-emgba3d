            --source-b "$RUNNER_TEMP/intro/girl-1.sav" --out "$RUNNER_TEMP/coop-saves" --only coop-a,coop-b
      - name: The co-op Gym battle, the friend's game closed during its award
        run: |
          .venv/Scripts/python scripts/multiplayer/native_launcher_coop_proof.py --close-during-award 1 \
            --game inputs/pokeemerald-mp.exe --sdl inputs/SDL2.dll --rom inputs/pokedev.gba \
            --manifest inputs/manifest.json --pe-symbols symbols/pokeemerald-mp.nm.txt \
            --sizes symbols/pokeemerald-mp.sizes.txt --slow 1.5 \
            --source-a "$RUNNER_TEMP/coop-saves/coop-a.sav" --source-b "$RUNNER_TEMP/coop-saves/coop-b.sav" \
