# Windows package: builds the launcher with the repository's pinned wheels
# (build_launcher.py, PyInstaller 6.22.3) on a Windows runner.
#
#   smoke (default; also runs on a push that touches the packaging files): synthetic,
#          asset-free inputs (scripts/windows-runtime/make_smoke_inputs.py). Needs no engine,
#          secrets, ROM or sprite pack; proves collect_native_bundle, build_launcher,
#          PyInstaller, the package audit and that the frozen launcher starts.
#   full   (manual): builds the game from the private engine first, then the same steps with
#          the real game. Needs the secrets listed in docs/windows-ci-packaging.md.
#
# Nothing here is published: no release, no Pages, no cache of game data; artifacts are
# private to the repository.
name: windows-package

on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke (synthetic inputs, no secrets) or full (the real game from the private engine)
        type: choice
        options: [smoke, full]
        default: smoke
      engine_ref:
        description: "full: engine branch, tag or commit to build"
        default: claude/emeraldtogether-combined
      version:
        description: Version label shown in the launcher (blank = "Native 3D CI <run number>")
        default: ""
      runner:
        description: windows-2022 (GitHub-hosted) or self-hosted (your own PC; private files stay on it)
        type: choice
        options: [windows-2022, self-hosted]
        default: windows-2022
      expected_rom_sha256:
        description: "full: fail unless the built game ROM has this SHA-256 (blank = just report it)"
        default: ""
  push:
    paths:
      - .github/workflows/windows-package.yml
      - scripts/windows-runtime/**
      - requirements-host-provisioning.txt
      - src/emerald_multiplayer/launcher*.py
      - src/emerald_multiplayer/player_runtime.py

permissions:
  contents: read

env:
  SDL_VERSION: "2.30.7"
  SDL_SHA256: 147c3dc03c9be6b23e625fd877421098e93487f1f55e0e1d4e3ce571e79b91c4
  # The owner's Emerald USA/Europe revision 0 dump (docs/release-patch-creation.md); a public identity.
  BASE_ROM_SHA256: a9dec84dfe7f62ab2220bafaef7479da0929d066ece16a6885f6226db19085af

jobs:
  engine:
    name: Build the game (Linux cross-compile)
    if: ${{ (inputs.mode || 'smoke') == 'full' }}
    runs-on: ubuntu-24.04
    outputs:
      engine_commit: ${{ steps.build.outputs.engine_commit }}
      rom_sha256: ${{ steps.build.outputs.rom_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Check out the private engine
        uses: actions/checkout@v4
        with:
          repository: kashkevin/personal-pokemon-game-emgba3d-engine
          ref: ${{ inputs.engine_ref }}
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential libpng-dev \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi mingw-w64
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: \
            -r app/requirements-host-provisioning.txt
      - name: SDL2 for MinGW (pinned)
        run: |
          curl -fsSL -o sdl.tgz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-devel-${SDL_VERSION}-mingw.tar.gz"
          echo "${SDL_SHA256}  sdl.tgz" | sha256sum -c -
          mkdir sdl && tar -xzf sdl.tgz -C sdl
      - name: Build the GBA ROM and the Windows 3D game
        id: build
        working-directory: engine
        run: |
          make -j"$(nproc)" BUILD_NAME=dev
          make -f Makefile_pc SDL_DIR="$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32" DIORAMA=1 -j"$(nproc)"
          i686-w64-mingw32-strip --strip-all pokeemerald-mp-diorama.exe
          rom_sha="$(sha256sum pokedev.gba | cut -d' ' -f1)"
          if [ -n "${{ inputs.expected_rom_sha256 }}" ] && [ "$rom_sha" != "${{ inputs.expected_rom_sha256 }}" ]; then
            echo "ROM sha256 $rom_sha differs from the expected pin" >&2; exit 1
          fi
          commit="$(git rev-parse HEAD)"
          echo "engine_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "rom_sha256=$rom_sha" >> "$GITHUB_OUTPUT"
          mkdir -p ../native-inputs
          cp pokeemerald-mp-diorama.exe pokedev.gba ../native-inputs/
          cp "$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32/bin/SDL2.dll" ../native-inputs/
          PYTHONPATH="$GITHUB_WORKSPACE/app/src" "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/app/scripts/multiplayer/generate_manifest.py" \
            --rom pokedev.gba --elf pokedev.elf --engine-commit "$commit" --output ../native-inputs/manifest.json
      - name: Hand the build to the Windows job (private, one day)
        uses: actions/upload-artifact@v4
        with:
          name: native-inputs
          path: native-inputs
          retention-days: 1
          if-no-files-found: error

  package:
    name: Build the launcher package (Windows)
    needs: engine
    if: ${{ !cancelled() && (needs.engine.result == 'success' || needs.engine.result == 'skipped') }}
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","windows"]') || 'windows-2022' }}
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ inputs.mode || 'smoke' }}
    steps:
      - name: Work folder outside the repository (a new one per run)
        run: echo "WORK=$RUNNER_TEMP/emerald-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Private virtual environment with the pinned, hashed wheels
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --require-hashes --only-binary=:all: \
            -r requirements-host-provisioning.txt -r scripts/windows-runtime/requirements-launcher-build.txt
      - name: Smoke inputs (synthetic, no game data)
        if: env.MODE == 'smoke'
        run: |
          .venv/Scripts/python scripts/windows-runtime/make_smoke_inputs.py \
            --exe "$(.venv/Scripts/python -c 'import sys;print(sys.base_prefix + "/python.exe")')" --output inputs
          echo "HAVE_SPRITES=false" >> "$GITHUB_ENV"
          echo "HAVE_BASE=false" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: env.MODE == 'full'
        with:
          name: native-inputs
          path: inputs
      - name: Private inputs (optional; see docs/windows-ci-packaging.md)
        if: env.MODE == 'full'
        env:
          SPRITE_PACK_URL: ${{ secrets.SPRITE_PACK_URL }}
          BASE_ROM_URL: ${{ secrets.BASE_ROM_URL }}
          SPRITE_PACK_SHA256: ${{ vars.SPRITE_PACK_SHA256 }}
          PRIVATE_INPUT_DIR: ${{ vars.PRIVATE_INPUT_DIR }}
        run: |
          fetch=scripts/windows-runtime/fetch_private_input.py
          have_sprites=false; have_base=false
          if [ -n "$SPRITE_PACK_SHA256" ]; then
            set +e
            .venv/Scripts/python "$fetch" --dest inputs/battle-sprites.ebsp --sha256 "$SPRITE_PACK_SHA256" \
              --max-bytes 33554432 --local-dir "$PRIVATE_INPUT_DIR" --local-name battle-sprites.ebsp --url-env SPRITE_PACK_URL
            rc=$?; set -e
            [ $rc -eq 0 ] && have_sprites=true
            [ $rc -ne 0 ] && [ $rc -ne 3 ] && exit $rc
          fi
          set +e
          .venv/Scripts/python "$fetch" --dest inputs/base-emerald.gba --sha256 "$BASE_ROM_SHA256" \
            --max-bytes 33554432 --local-dir "$PRIVATE_INPUT_DIR" --local-name base-emerald.gba --url-env BASE_ROM_URL
          rc=$?; set -e
          [ $rc -eq 0 ] && have_base=true
          [ $rc -ne 0 ] && [ $rc -ne 3 ] && exit $rc
          echo "HAVE_SPRITES=$have_sprites" >> "$GITHUB_ENV"
          echo "HAVE_BASE=$have_base" >> "$GITHUB_ENV"
      - name: Collect the native runtime bundle
        run: |
          extra=()
          [ "$HAVE_SPRITES" = true ] && extra=(--extra inputs/battle-sprites.ebsp)
          .venv/Scripts/python scripts/windows-runtime/collect_native_bundle.py \
            --game inputs/pokeemerald-mp-diorama.exe --sdl inputs/SDL2.dll --rom inputs/pokedev.gba \
            --output "$WORK/runtime" "${extra[@]}" | tee "$WORK.bundle.json"
      - name: Build the launcher package (development preview)
        run: |
          pin() { .venv/Scripts/python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$1"; }
          version="${{ inputs.version }}"; [ -n "$version" ] || version="Native 3D CI ${{ github.run_number }}"
          [ "$MODE" = smoke ] && version="Smoke test ${{ github.run_number }}"
          patch=()
          [ "$HAVE_BASE" = true ] && patch=(--base inputs/base-emerald.gba --base-sha256 "$BASE_ROM_SHA256" --create-patch)
          .venv/Scripts/python scripts/windows-runtime/build_launcher.py \
            --rom inputs/pokedev.gba --manifest inputs/manifest.json --runtime "$WORK/runtime" \
            --rom-sha256 "$(pin inputs/pokedev.gba)" --manifest-sha256 "$(pin inputs/manifest.json)" \
            --runtime-sha256 "$(pin "$WORK/runtime/runtime.json")" \
            --version "$version" --development-preview "${patch[@]}" \
            --output "$WORK/launcher" < /dev/null 2>&1 | cat
      - name: Check the package contents
        run: |
          .venv/Scripts/python - <<'PY'
          import json, os, zipfile
          work = os.environ["WORK"] + "/launcher"
          names = zipfile.ZipFile(work + "/EmeraldTogether.zip").namelist()
          assert any(n.endswith("EmeraldTogether/EmeraldTogether.exe") or n == "EmeraldTogether/EmeraldTogether.exe" for n in names), names[:20]
          bad = [n for n in names if n.lower().endswith((".gba", ".sav", ".sqlite3", ".db", ".pem", ".key"))]
          assert not bad, bad
          hashes = json.load(open(work + "/package-hashes.json"))
          audit = json.load(open(work + "/package-audit.json"))
          print(len(names), "archive members;", len(hashes), "hashed files; audit keys", sorted(audit))
          PY
      - name: Start the frozen launcher and watch it stay up (smoke)
        if: env.MODE == 'smoke'
        shell: pwsh
        run: |
          $exe = Join-Path $env:WORK "launcher\dist\EmeraldTogether\EmeraldTogether.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "EmeraldTogether.exe exited early with code $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path $env:WORK "launcher-screen.png"))
          Stop-Process -Id $p.Id -Force
          "launcher stayed up for 20 s (pid $($p.Id))"
      - name: Summary
        run: |
          {
            echo "### Windows package"
            echo "- Mode: $MODE"
            echo "- Engine commit: \`${{ needs.engine.outputs.engine_commit }}\`"
            echo "- Game ROM sha256: \`${{ needs.engine.outputs.rom_sha256 }}\`"
            echo "- Sprite pack in the runtime: $HAVE_SPRITES"
            echo "- Import of the owner's own game enabled: $HAVE_BASE"
            echo "- Archive sha256: \`$(.venv/Scripts/python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$WORK/launcher/EmeraldTogether.zip")\`"
            echo "- Private development preview; clean-PC, gameplay and network acceptance are separate."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the package (private to this repository, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldTogether-windows-${{ env.MODE }}
          path: |
            ${{ env.WORK }}/launcher-screen.png
            ${{ env.WORK }}/launcher/EmeraldTogether.zip
            ${{ env.WORK }}/launcher/package-hashes.json
            ${{ env.WORK }}/launcher/package-audit.json
            ${{ env.WORK }}/launcher/build.log
          retention-days: 7
          if-no-files-found: warn
      - name: Remove private inputs from the runner
        if: always()
        run: rm -rf inputs "$WORK"
