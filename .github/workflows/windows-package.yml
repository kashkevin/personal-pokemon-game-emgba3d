    # offline (KNOWN_ISSUES MS-156: the Kecleons, Voltorbs, Electrodes, Regis, Rayquaza and Lugia each start their
    # battle in a save no world has enrolled; tools/qa/gameplay_check.py --static-encounters, its plan from the engine).
    name: Move switching, shiny wild Pokemon, the Game Corner, the Rotom Catalog, the Acro Bike, Fly, the TM catalogue, the item hub and the static encounters (Windows game processes)
    needs: engine
    if: ${{ (inputs.mode || 'smoke') == 'full' && (!inputs.only || contains(format(',{0},', inputs.only), ',feature-checks,')) }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: mega-check-inputs
          path: mega-check-inputs
      - uses: actions/download-artifact@v8
        with:
          name: gameplay-inputs
          path: gameplay-inputs
      - name: A character from the short introduction, then each check from that save
        shell: pwsh
        run: |
          $exe = "mega-check-inputs\pokeemerald-mp-bfxtest.exe"
          $out = Join-Path $env:RUNNER_TEMP "feature-checks"
          $save = Join-Path $env:RUNNER_TEMP "town.sav"
          python mega-check-inputs\mega_check.py --exe $exe --make-save $save --out (Join-Path $out "save") --no-cases
          # mega_check exits 1 when it ran no case ("passed 0 of 0", run 217): only the save matters here.
          if (-not (Test-Path $save)) { throw "the short introduction's save was not made ($LASTEXITCODE)" }
          $failed = @()
          # casino_check sits with the engine files it reads (the engine job).
          $checks = [ordered]@{ move_switch_check = "mega-check-inputs\move_switch_check.py"
                                shiny_check = "mega-check-inputs\shiny_check.py"
                                casino_check = "mega-check-inputs\casino\tools\battle_env\casino_check.py"
                                rotom_check = "mega-check-inputs\casino\tools\battle_env\rotom_check.py"
                                acro_check = "mega-check-inputs\acro_check.py"
                                flymap_check = "mega-check-inputs\flymap_check.py"
                                tm_catalogue_check = "mega-check-inputs\casino\tools\battle_env\tm_catalogue_check.py"
                                item_hub_check = "mega-check-inputs\casino\tools\battle_env\item_hub_check.py" }
          foreach ($check in $checks.Keys) {
            if (-not (Test-Path $checks[$check])) {
              Write-Output "::notice::this engine has no $check (tools/battle_env/$check.py)"
              continue
            }
            python $checks[$check] --exe $exe --save $save --out (Join-Path $out $check)
            if ($LASTEXITCODE -ne 0) { $failed += "$check (exit $LASTEXITCODE)" }
          }
          # The static encounters: each must start its battle (MS-156); the plan carries the state they need.
          if (Test-Path gameplay-inputs\static-plan\plan.json) {
            python gameplay-inputs\tools\qa\gameplay_check.py --exe $exe --plan gameplay-inputs\static-plan\plan.json `
              --static-encounters --save $save --out (Join-Path $out "static_encounters")
            if ($LASTEXITCODE -ne 0) { $failed += "static encounters (exit $LASTEXITCODE)" }
          } else {
            Write-Output "::notice::this engine has no static encounters' check (gameplay_check.py --static-encounters)"
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }
      - name: Upload the reports (private to this repository, 7 days; no save)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: EmeraldTogether-feature-checks
          path: |
            ${{ runner.temp }}/feature-checks/**/*.json
            ${{ runner.temp }}/feature-checks/**/test.log
            ${{ runner.temp }}/feature-checks/**/*.png
          retention-days: 7
