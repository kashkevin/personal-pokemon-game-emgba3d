    # strip). The characters come from the game's own short introduction; the test build then gives them their
    # fixtures (make_tower_saves.py crush-a/-b/-c/-d at four Pokemon Centers' 2F, jump-a to -d and dodrio-a to -d in
    # Mossdeep's minigame building). Each: the attendant, WORLD PLAYERS, the game's own save, the lobby in the Players
    # menu, the host's group, the friends joining, the host starting it; the game itself as players play it (Berry
    # Crush: a Berry each and A mashed; Pokemon Jump: A as the vine comes down; Dodrio Berry Picking, three players or
    # more: picking), the results the same in every game, the host YES and the friends NO to playing again, every game
    # back on the field with no communication error, every link frame through the host; then the saves, a fresh
