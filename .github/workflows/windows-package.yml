# Windows package: builds the launcher with the repository's pinned wheels
# (build_launcher.py, PyInstaller 6.22.3) on a Windows runner, packs it into the player's
# installer (Inno Setup, scripts/windows-runtime/installer/EmeraldTogether.iss) and checks that
# installer on a fresh GitHub-hosted runner (docs/windows-installation.md).
#
#   smoke (default; also runs on a push that touches the packaging files): synthetic,
#          asset-free inputs (scripts/windows-runtime/make_smoke_inputs.py). Needs no engine,
#          secrets, ROM or sprite pack; proves collect_native_bundle (with game facts),
#          build_launcher, PyInstaller, the package audit, the installer build, that the frozen
#          launcher starts, and the silent install / start / repair / uninstall check.
#   full   (manual): builds the game from the private engine first, then the same steps with
#          the real game. Needs the secrets listed in docs/windows-ci-packaging.md.
#
# Artifacts: EmeraldTogether-Windows-Installer (full; "-smoke-test" in smoke mode) holds only
# what a friend downloads - the Setup file and QUICK-START.txt. EmeraldTogether-windows-<mode>
# is the developer artifact (zip, hashes, audit, reports, screenshots). EmeraldTogether-mega-check
# (full) is the Mega Evolution check's report: real Windows game processes of a test build that is
# never packaged (Makefile_pc BFX_TEST=1, the Classic 2D game with the battle test driver);
# EmeraldTogether-feature-check (full) is the same build's starter, soft reset and reroll check.
# EmeraldTogether-multiplayer-check-* (full) are the multiplayer gameplay proofs' records (evidence.json): two to four
# players through the whole launcher with the Classic 2D game it packages, in real Windows game processes.
# Nothing here is published: no release, no Pages, no cache of game data; artifacts are
# private to the repository. The package never contains a .gba, save or database.
name: windows-package

on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke (synthetic inputs, no secrets) or full (the real game from the private engine)
        type: choice
        options: [smoke, full]
        default: smoke
      engine_ref:
        description: "full: engine branch, tag or commit to build"
        default: claude/emeraldtogether-combined
      version:
        description: Version label shown in the launcher (blank = "Native 3D CI <run number>")
        default: ""
      runner:
        description: windows-2022 (GitHub-hosted) or self-hosted (your own PC; private files stay on it)
        type: choice
        options: [windows-2022, self-hosted]
        default: windows-2022
      expected_rom_sha256:
        description: "full: fail unless the built game ROM has this SHA-256 (blank = just report it)"
        default: ""
  push:
    paths:
      - .github/workflows/windows-package.yml
      - scripts/windows-runtime/**
      - requirements-host-provisioning.txt
      - src/emerald_multiplayer/launcher*.py
      - src/emerald_multiplayer/player_runtime.py
      - src/emerald_multiplayer/graphics_mode.py
      - src/emerald_multiplayer/game_facts.py
      - src/emerald_multiplayer/installation_check.py

permissions:
  contents: read

env:
  SDL_VERSION: "2.30.7"
  SDL_SHA256: 147c3dc03c9be6b23e625fd877421098e93487f1f55e0e1d4e3ce571e79b91c4
  # The owner's Emerald USA/Europe revision 0 dump (docs/release-patch-creation.md); a public identity.
  BASE_ROM_SHA256: a9dec84dfe7f62ab2220bafaef7479da0929d066ece16a6885f6226db19085af
  # GitHub's windows-2022 image ships Inno Setup 6.7.1 as `iscc` (runner-images Windows2022-Readme);
  # a runner without it installs exactly this version from Chocolatey.
  INNO_SETUP_VERSION: "6.7.1"
  # The player-facing artifact: only the Setup file and QUICK-START.txt.
  INSTALLER_ARTIFACT: ${{ (inputs.mode || 'smoke') == 'full' && 'EmeraldTogether-Windows-Installer' || 'EmeraldTogether-Windows-Installer-smoke-test' }}

jobs:
  engine:
    name: Build the game (Linux cross-compile)
    if: ${{ (inputs.mode || 'smoke') == 'full' }}
    runs-on: ubuntu-24.04
    outputs:
      engine_commit: ${{ steps.build.outputs.engine_commit }}
      rom_sha256: ${{ steps.build.outputs.rom_sha256 }}
      exe_sha256: ${{ steps.build.outputs.exe_sha256 }}
      classic_exe_sha256: ${{ steps.build.outputs.classic_exe_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Check out the private engine
        uses: actions/checkout@v4
        with:
          repository: kashkevin/personal-pokemon-game-emgba3d-engine
          ref: ${{ inputs.engine_ref }}
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential libpng-dev \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi mingw-w64
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: \
            -r app/requirements-host-provisioning.txt
          # The engine's build tools (graphics, Diorama rules, ABI checks) import Pillow, NumPy and pyelftools.
          python -m venv .tools
          .tools/bin/python -m pip install --only-binary=:all: -r app/requirements-dev.txt
      - name: SDL2 for MinGW (pinned)
        run: |
          curl -fsSL -o sdl.tgz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-devel-${SDL_VERSION}-mingw.tar.gz"
          echo "${SDL_SHA256}  sdl.tgz" | sha256sum -c -
          mkdir sdl && tar -xzf sdl.tgz -C sdl
      - name: Build the GBA ROM, the Windows 3D game and the Classic 2D game
        id: build
        working-directory: engine
        run: |
          export PATH="$GITHUB_WORKSPACE/.tools/bin:$PATH"
          make -j"$(nproc)" BUILD_NAME=dev
          make -f Makefile_pc SDL_DIR="$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32" DIORAMA=1 -j"$(nproc)"
          # PC-only battle features (the free-for-all) advertise themselves in the native game, not in the GBA ROM.
          i686-w64-mingw32-nm --print-size --defined-only pokeemerald-mp-diorama.exe > native-symbols.txt
          i686-w64-mingw32-strip --strip-all pokeemerald-mp-diorama.exe
          # The Classic 2D game: the same engine without DIORAMA=1 (Graphics mode in the launcher).
          make -f Makefile_pc SDL_DIR="$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32" -j"$(nproc)"
          # The multiplayer gameplay job reads the running games' memory at their symbols: the table before the strip.
          mkdir -p ../classic-pe-symbols
          i686-w64-mingw32-nm -n pokeemerald-mp.exe > ../classic-pe-symbols/pokeemerald-mp.nm.txt
          i686-w64-mingw32-strip --strip-all pokeemerald-mp.exe
          # The Mega Evolution check's test build (never packaged): the Classic 2D game with the battle test driver.
          make -f Makefile_pc SDL_DIR="$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32" BFX_TEST=1 -j"$(nproc)"
          i686-w64-mingw32-strip --strip-all pokeemerald-mp-bfxtest.exe
          mkdir -p ../mega-check-inputs
          cp pokeemerald-mp-bfxtest.exe tools/battle_env/mega_check.py tools/battle_env/feature_check.py ../mega-check-inputs/
          cp "$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32/bin/SDL2.dll" ../mega-check-inputs/
          rom_sha="$(sha256sum pokedev.gba | cut -d' ' -f1)"
          if [ -n "${{ inputs.expected_rom_sha256 }}" ] && [ "$rom_sha" != "${{ inputs.expected_rom_sha256 }}" ]; then
            echo "ROM sha256 $rom_sha differs from the expected pin" >&2; exit 1
          fi
          commit="$(git rev-parse HEAD)"
          echo "engine_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "rom_sha256=$rom_sha" >> "$GITHUB_OUTPUT"
          echo "exe_sha256=$(sha256sum pokeemerald-mp-diorama.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "classic_exe_sha256=$(sha256sum pokeemerald-mp.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          mkdir -p ../native-inputs
          cp pokeemerald-mp-diorama.exe pokeemerald-mp.exe pokedev.gba ../native-inputs/
          cp "$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32/bin/SDL2.dll" ../native-inputs/
          # The 3D battle effects the game reads beside its executable (without them every move plays its GBA animation).
          cp -r battlefx ../native-inputs/battlefx
          PYTHONPATH="$GITHUB_WORKSPACE/app/src" "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/app/scripts/multiplayer/generate_manifest.py" \
            --rom pokedev.gba --elf pokedev.elf --engine-commit "$commit" --native-symbols native-symbols.txt --output ../native-inputs/manifest.json
          # Every PC-only marker the Windows game has must be in its manifest: without the presence detail the companion
          # refuses the game's pose off the field and closes its link (MinGW nm prints no symbol sizes; 2026-10-19).
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import json, re
          symbols = open("native-symbols.txt").read()
          manifest = json.load(open("../native-inputs/manifest.json"))
          markers = {"gMultiplayerBattleFfaAbiVersion": "battle_ffa_abi_version", "gMultiplayerRivalAbiVersion": "rival_abi_version",
                     "gMultiplayerBattleFfa3AbiVersion": "battle_ffa3_abi_version",
                     "gMultiplayerPresenceDetailAbiVersion": "presence_detail_abi_version",
                     "gMultiplayerMenuReleaseAbiVersion": "menu_release_abi_version",
                     "gMultiplayerSaveImportWindowAbiVersion": "save_import_window_abi_version"}
          present = [field for symbol, field in markers.items() if re.search(rf"\s_?{symbol}$", symbols, re.M)]
          missing = [field for field in present if manifest.get(field) != 1]
          assert not missing, f"the Windows game has these markers but its manifest lacks {missing}"
          print("PC-only markers in the manifest:", present)
          PY
      - name: Hand the build to the Windows job (private, one day)
        uses: actions/upload-artifact@v4
        with:
          name: native-inputs
          path: native-inputs
          retention-days: 1
          if-no-files-found: error
      - name: Hand the Mega check's test build to its Windows job (private, one day)
        uses: actions/upload-artifact@v4
        with:
          name: mega-check-inputs
          path: mega-check-inputs
          retention-days: 1
          if-no-files-found: error
      - name: Hand the Classic game's symbol table to the multiplayer job (private, one day)
        uses: actions/upload-artifact@v4
        with:
          name: classic-pe-symbols
          path: classic-pe-symbols
          retention-days: 1
          if-no-files-found: error

  mega-check:
    # Update 32, Mega Evolution: single-player Mega battles in real Windows game processes (a GitHub-hosted runner, not
    # a player's PC). The character comes from the game's own short introduction on the runner (no save is brought);
    # then the cases (wild, trainer, Gym, rival, doubles, a Multi, both sides, no Mega Ring, another species' stone, a
    # species without a Mega, Zygarde-Complete), every Mega Stone holder of the form change tables in a battle of its
    # own, every Mega form drawn, and a stone given, used, taken, saved, loaded, reset away and bought with the Ring
    # through the game's own menus, each read from the game's own log (tools/battle_env/mega_check.py).
    name: Mega Evolution check (Windows game processes)
    needs: engine
    if: ${{ (inputs.mode || 'smoke') == 'full' }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: mega-check-inputs
          path: mega-check-inputs
      - name: A character from the short introduction, then every case, holder, form and the stones in the menus
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "mega-check"
          $save = Join-Path $env:RUNNER_TEMP "mega.sav"
          $exe = "mega-check-inputs\pokeemerald-mp-bfxtest.exe"
          python mega-check-inputs\mega_check.py --exe $exe --make-save $save --out $out --sweep --parade --items --jobs 3
          $normal = $LASTEXITCODE
          # The same holders and forms shiny (the legendary ones too).
          python mega-check-inputs\mega_check.py --exe $exe --save $save --out $out --no-cases --sweep --parade --shiny --jobs 3
          $shiny = $LASTEXITCODE
          if ($normal -ne 0 -or $shiny -ne 0) { throw "the Mega Evolution check failed (exit $normal, shiny $shiny)" }
      - name: Upload the Mega check report (private to this repository, 7 days; no save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldTogether-mega-check
          path: |
            ${{ runner.temp }}/mega-check/**/*.json
            ${{ runner.temp }}/mega-check/**/*.log
            ${{ runner.temp }}/mega-check/**/*.png
          retention-days: 7
          if-no-files-found: warn

  feature-check:
    # Update 32, features 1-5 (feature 16: Windows): the single-player ones in real Windows game processes of the same
    # test build (a GitHub-hosted runner, not a player's PC). A character from the game's own short introduction, its
    # save with no Pokemon, a save in Birch's lab, the starter claimed from the Fire ball and saved, that save loaded,
    # then the claim and the game's own soft reset (START > PLAYER > RESET) three times in one process: the claim open
    # again after each reset and every claim a new roll - each read from the game's own log
    # (tools/battle_env/feature_check.py).
    name: Starters, soft reset and rerolls (Windows game processes)
    needs: engine
    if: ${{ (inputs.mode || 'smoke') == 'full' }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: mega-check-inputs
          path: mega-check-inputs
      - name: A new character, no Pokemon, a starter claimed and saved, three rerolls by soft reset
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "feature-check"
          $save = Join-Path $env:RUNNER_TEMP "new.sav"
          python mega-check-inputs\feature_check.py --exe mega-check-inputs\pokeemerald-mp-bfxtest.exe --make-save $save --out $out
          if ($LASTEXITCODE -ne 0) { throw "the starter and soft reset check failed (exit $LASTEXITCODE)" }
      - name: Upload the check's report (private to this repository, 7 days; no save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldTogether-feature-check
          path: |
            ${{ runner.temp }}/feature-check/**/*.json
            ${{ runner.temp }}/feature-check/**/*.log
            ${{ runner.temp }}/feature-check/**/*.png
          retention-days: 7
          if-no-files-found: warn

  symbol-sizes:
    # The Windows game's symbol table has addresses but no sizes (MinGW nm prints none); the Linux build of the same
    # engine commit has both, and each size must fit the Windows layout (scripts/multiplayer/native_trade_proof.py
    # parse_pe_symbols). For the multiplayer job's memory reads only; nothing of this build is packaged or uploaded but
    # its symbol list.
    name: Symbol sizes (the Linux Classic 2D game)
    if: ${{ (inputs.mode || 'smoke') == 'full' }}
    runs-on: ubuntu-24.04
    # A clean Ubuntu 24.04: the runner image's own -dev packages keep the 32-bit SDL2 one from installing.
    container:
      image: ubuntu:24.04
    timeout-minutes: 60
    outputs:
      engine_commit: ${{ steps.build.outputs.engine_commit }}
    steps:
      - name: Toolchain (the native game is a 32-bit Linux program with SDL2)
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates \
            python3 python3-venv build-essential gcc-multilib libpng-dev pkg-config \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libsdl2-dev:i386
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Check out the private engine
        uses: actions/checkout@v4
        with:
          repository: kashkevin/personal-pokemon-game-emgba3d-engine
          ref: ${{ inputs.engine_ref }}
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - name: The engine's build tools (graphics, rules, ABI checks import Pillow, NumPy and pyelftools)
        run: |
          python3 -m venv .tools
          .tools/bin/python -m pip install -q --only-binary=:all: -r app/requirements-dev.txt
      - name: Build the GBA ROM's assets and the Linux Classic 2D game
        id: build
        working-directory: engine
        run: |
          git config --global --add safe.directory "$PWD"
          export PATH="$GITHUB_WORKSPACE/.tools/bin:$PATH"
          make -j"$(nproc)" BUILD_NAME=dev
          make -f Makefile_pc NATIVE_LINUX=1 -j"$(nproc)"
          mkdir -p ../classic-linux-sizes
          nm -S pokeemerald-mp > ../classic-linux-sizes/pokeemerald-mp.sizes.txt
          echo "engine_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Hand the symbol sizes to the multiplayer job (private, one day)
        uses: actions/upload-artifact@v4
        with:
          name: classic-linux-sizes
          path: classic-linux-sizes
          retention-days: 1
          if-no-files-found: error

  multiplayer-check:
    # The final master update (QM-6): multiplayer gameplay in real Windows game processes on a GitHub-hosted runner
    # (not a player's PC). The whole launcher - a real LauncherWindow, SessionWorker and LauncherSession per player and
    # the world server - with the Classic 2D game it packages; two to four new characters from the game's own short
    # introduction (no save is brought or kept); keys are the keyboard's messages posted to each game's window and what
    # is on screen is read from the games' memory (scripts/multiplayer/native_launcher_newcomers_proof.py, Windows
    # mode of native_launcher_battle_proof.py). Starters claimed at once, battle lobbies, mixed parties, a battle and a
    # trade at the same time, soft resets with others playing, what the others see while one is in a menu. One PC on
    # its own loopback: no second PC, router or Internet.
    name: Multiplayer gameplay (Windows game processes, ${{ matrix.players }} players, ${{ matrix.scenario }})
    needs: [engine, symbol-sizes]
    if: ${{ (inputs.mode || 'smoke') == 'full' }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scenario: busy, players: 4, format: 1v1v1v1}
          - {scenario: mixed, players: 4, format: 2v2}
          - {scenario: lobby, players: 4, format: 1v1v1v1}
          - {scenario: lobby, players: 3, format: 1v1v1v1}
    defaults:
      run:
        shell: bash
    steps:
      - name: Both builds come from one engine commit
        run: |
          [ "${{ needs.engine.outputs.engine_commit }}" = "${{ needs.symbol-sizes.outputs.engine_commit }}" ] || {
            echo "the Windows game and the Linux symbol sizes are of different engine commits" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Private virtual environment with the pinned, hashed wheels
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --require-hashes --only-binary=:all: -r requirements-host-provisioning.txt
      - uses: actions/download-artifact@v4
        with:
          name: native-inputs
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          name: mega-check-inputs
          path: mega-check-inputs
      - uses: actions/download-artifact@v4
        with:
          name: classic-pe-symbols
          path: symbols
      - uses: actions/download-artifact@v4
        with:
          name: classic-linux-sizes
          path: symbols
      - name: New characters from the game's own short introduction (boys and girls)
        run: |
          .venv/Scripts/python scripts/multiplayer/make_intro_saves.py --exe mega-check-inputs/pokeemerald-mp-bfxtest.exe \
            --mega-check mega-check-inputs/mega_check.py --out "$RUNNER_TEMP/intro" --count ${{ matrix.players }}
      - name: ${{ matrix.players }} new characters in one world (${{ matrix.scenario }})
        run: |
          # make_intro_saves.py's names, in its order (no glob over a Windows path in bash)
          names=(boy-1 girl-1 boy-2 girl-2); sources=()
          for n in $(seq 0 $(( ${{ matrix.players }} - 1 ))); do sources+=(--source "$RUNNER_TEMP/intro/${names[$n]}.sav"); done
          .venv/Scripts/python scripts/multiplayer/native_launcher_newcomers_proof.py --scenario ${{ matrix.scenario }} \
            --format ${{ matrix.format }} --game inputs/pokeemerald-mp.exe --sdl inputs/SDL2.dll --rom inputs/pokedev.gba \
            --manifest inputs/manifest.json --pe-symbols symbols/pokeemerald-mp.nm.txt \
            --sizes symbols/pokeemerald-mp.sizes.txt --slow 1.5 "${sources[@]}" \
            --output "$RUNNER_TEMP/multiplayer-proof/${{ matrix.scenario }}-${{ matrix.players }}"
      - name: Upload the proof's record (private to this repository, 7 days; no save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldTogether-multiplayer-check-${{ matrix.scenario }}-${{ matrix.players }}
          path: |
            ${{ runner.temp }}/multiplayer-proof/*/evidence.json
            ${{ runner.temp }}/multiplayer-proof/*/*.jsonl
            ${{ runner.temp }}/multiplayer-proof/*/*.png
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Build the launcher package (Windows)
    needs: engine
    if: ${{ !cancelled() && (needs.engine.result == 'success' || needs.engine.result == 'skipped') }}
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","windows"]') || 'windows-2022' }}
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ inputs.mode || 'smoke' }}
    steps:
      - name: Work folder outside the repository (a new one per run)
        run: echo "WORK=$RUNNER_TEMP/emerald-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Private virtual environment with the pinned, hashed wheels
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --require-hashes --only-binary=:all: \
            -r requirements-host-provisioning.txt -r scripts/windows-runtime/requirements-launcher-build.txt
      - name: Smoke inputs (synthetic, no game data)
        if: env.MODE == 'smoke'
        run: |
          .venv/Scripts/python scripts/windows-runtime/make_smoke_inputs.py \
            --exe "$(.venv/Scripts/python -c 'import sys;print(sys.base_prefix + "/python.exe")')" --output inputs
          echo "HAVE_SPRITES=false" >> "$GITHUB_ENV"
          echo "HAVE_BASE=false" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: env.MODE == 'full'
        with:
          name: native-inputs
          path: inputs
      - name: Private inputs (optional; see docs/windows-ci-packaging.md)
        if: env.MODE == 'full'
        env:
          SPRITE_PACK_URL: ${{ secrets.SPRITE_PACK_URL }}
          BASE_ROM_URL: ${{ secrets.BASE_ROM_URL }}
          SPRITE_PACK_SHA256: ${{ vars.SPRITE_PACK_SHA256 }}
          PRIVATE_INPUT_DIR: ${{ vars.PRIVATE_INPUT_DIR }}
        run: |
          fetch=scripts/windows-runtime/fetch_private_input.py
          have_sprites=false; have_base=false
          if [ -n "$SPRITE_PACK_SHA256" ]; then
            set +e
            .venv/Scripts/python "$fetch" --dest inputs/battle-sprites.ebsp --sha256 "$SPRITE_PACK_SHA256" \
              --max-bytes 33554432 --local-dir "$PRIVATE_INPUT_DIR" --local-name battle-sprites.ebsp --url-env SPRITE_PACK_URL
            rc=$?; set -e
            [ $rc -eq 0 ] && have_sprites=true
            [ $rc -ne 0 ] && [ $rc -ne 3 ] && exit $rc
          fi
          set +e
          .venv/Scripts/python "$fetch" --dest inputs/base-emerald.gba --sha256 "$BASE_ROM_SHA256" \
            --max-bytes 33554432 --local-dir "$PRIVATE_INPUT_DIR" --local-name base-emerald.gba --url-env BASE_ROM_URL
          rc=$?; set -e
          [ $rc -eq 0 ] && have_base=true
          [ $rc -ne 0 ] && [ $rc -ne 3 ] && exit $rc
          echo "HAVE_SPRITES=$have_sprites" >> "$GITHUB_ENV"
          echo "HAVE_BASE=$have_base" >> "$GITHUB_ENV"
      - name: Collect the native runtime bundle
        run: |
          extra=()
          [ "$HAVE_SPRITES" = true ] && extra=(--extra inputs/battle-sprites.ebsp)
          # --manifest pins game-facts.json (recorded after a full check of the ROM): the package then needs no game.gba.
          # --battle-effects pins the engine's battlefx folder (runtime/battlefx, runtime.json "data").
          .venv/Scripts/python scripts/windows-runtime/collect_native_bundle.py \
            --game inputs/pokeemerald-mp-diorama.exe --classic-game inputs/pokeemerald-mp.exe \
            --sdl inputs/SDL2.dll --rom inputs/pokedev.gba --manifest inputs/manifest.json \
            --battle-effects inputs/battlefx \
            --output "$WORK/runtime" "${extra[@]}" | tee "$WORK.bundle.json"
      - name: Inno Setup compiler (preinstalled on windows-2022; pinned Chocolatey install otherwise)
        run: |
          if command -v iscc >/dev/null 2>&1; then
            iscc_path="$(command -v iscc)"
          elif [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            iscc_path="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          else
            choco install innosetup --version="$INNO_SETUP_VERSION" -y --no-progress
            iscc_path="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          fi
          "$iscc_path" 2>&1 | head -n 2 || true
          echo "ISCC=$(cygpath -w "$iscc_path")" >> "$GITHUB_ENV"
      - name: Build the launcher package (development preview)
        run: |
          pin() { .venv/Scripts/python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$1"; }
          version="${{ inputs.version }}"; [ -n "$version" ] || version="Native 3D CI ${{ github.run_number }}"
          [ "$MODE" = smoke ] && version="Smoke test ${{ github.run_number }}"
          patch=()
          [ "$HAVE_BASE" = true ] && patch=(--base inputs/base-emerald.gba --base-sha256 "$BASE_ROM_SHA256" --create-patch)
          .venv/Scripts/python scripts/windows-runtime/build_launcher.py \
            --rom inputs/pokedev.gba --manifest inputs/manifest.json --runtime "$WORK/runtime" \
            --rom-sha256 "$(pin inputs/pokedev.gba)" --manifest-sha256 "$(pin inputs/manifest.json)" \
            --runtime-sha256 "$(pin "$WORK/runtime/runtime.json")" \
            --version "$version" --development-preview "${patch[@]}" \
            --installer --iscc "$ISCC" \
            --output "$WORK/launcher" < /dev/null 2>&1 | cat
      - name: Check the package contents
        run: |
          .venv/Scripts/python - <<'PY'
          import json, os, zipfile
          work = os.environ["WORK"] + "/launcher"
          names = zipfile.ZipFile(work + "/EmeraldTogether.zip").namelist()
          assert any(n.endswith("EmeraldTogether/EmeraldTogether.exe") or n == "EmeraldTogether/EmeraldTogether.exe" for n in names), names[:20]
          bad = [n for n in names if n.lower().endswith((".gba", ".sav", ".sqlite3", ".db", ".pem", ".key"))]
          assert not bad, bad
          hashes = json.load(open(work + "/package-hashes.json"))
          audit = json.load(open(work + "/package-audit.json"))
          print(len(names), "archive members;", len(hashes), "hashed files; audit keys", sorted(audit))
          # The package carries its game facts and needs no game.gba.
          assert "_internal/runtime/game-facts.json" in hashes, sorted(hashes)[:40]
          assert not [n for n in hashes if n.lower().endswith((".gba", ".sav", ".sqlite3", ".db"))]
          # The installer and the player's download: exactly the Setup file and QUICK-START.txt.
          installer = json.load(open(work + "/installer.json"))
          player = sorted(os.listdir(work + "/player"))
          assert player == sorted([installer["setup"], "QUICK-START.txt"]), player
          assert installer["setup"].startswith("EmeraldTogether-Setup-") and installer["setup"].endswith(".exe")
          print("installer:", installer["setup"], installer["setup_bytes"], "bytes, sha256", installer["setup_sha256"])
          PY
      - name: Verify the packaged game files
        env:
          ENGINE_EXE_SHA256: ${{ needs.engine.outputs.exe_sha256 }}
          ENGINE_CLASSIC_EXE_SHA256: ${{ needs.engine.outputs.classic_exe_sha256 }}
          ENGINE_ROM_SHA256: ${{ needs.engine.outputs.rom_sha256 }}
          PYTHONPATH: src
        run: |
          .venv/Scripts/python - <<'PY'
          import hashlib, json, os, pathlib
          dist = pathlib.Path(os.environ["WORK"]) / "launcher/dist/EmeraldTogether"
          records = list(dist.rglob("runtime.json"))
          assert len(records) == 1, records
          runtime = records[0].parent
          manifest = json.loads(records[0].read_text())
          print("runtime:", runtime.relative_to(dist).as_posix(), manifest["format"], manifest["executable"], sorted(manifest["files"]))
          assert manifest["format"] == "emerald-native-runtime-v1"
          for name, digest in manifest["files"].items():
              data = (runtime / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, name
              print(f"  {name}: {len(data)} bytes, sha256 {digest}")
          exe = (runtime / manifest["executable"]).read_bytes()
          assert exe[:2] == b"MZ", "not a Windows executable"
          classic_name = manifest.get("classic_executable")
          assert classic_name in manifest["files"], "the package pins no Classic 2D game"
          classic = (runtime / classic_name).read_bytes()
          assert classic[:2] == b"MZ" and classic_name != manifest["executable"]
          print("  Classic 2D game:", classic_name, len(classic), "bytes")
          if os.environ["MODE"] == "full":
              assert len(exe) > 10_000_000, "game executable is implausibly small"
              assert hashlib.sha256(exe).hexdigest() == os.environ["ENGINE_EXE_SHA256"], "packaged game differs from the engine job's build"
              print("packaged game executable is the engine job's build")
              assert hashlib.sha256(classic).hexdigest() == os.environ["ENGINE_CLASSIC_EXE_SHA256"], "packaged Classic 2D game differs from the engine job's build"
              assert len(classic) > 5_000_000, "Classic 2D executable is implausibly small"
              print("packaged Classic 2D executable is the engine job's build")
          # The 3D battle effects beside the game (runtime/battlefx), each file pinned in runtime.json "data".
          data = manifest.get("data", {})
          for required in ("battlefx/bfx_core.js", "battlefx/bfx_moves.json", "battlefx/settings.cfg"):
              assert required in data, f"the package has no {required}: every move would play its GBA animation"
          for key, digest in data.items():
              assert hashlib.sha256((runtime / key).read_bytes()).hexdigest() == digest, key
          if os.environ["MODE"] == "full":
              assert len(data) >= 20 and (runtime / "battlefx/bfx_core.js").stat().st_size > 1_000_000, \
                  "the battle effects are not the engine's battlefx folder"
          print("battle effects:", len(data), "files pinned,", sum((runtime / key).stat().st_size for key in data), "bytes")
          assert (dist / "EmeraldTogether.exe").is_file()
          for guide in ("README.txt", "QUICK-START.txt", "RELEASE-LIMITS.txt", "HOSTING.txt"):
              assert (dist / guide).is_file(), guide
          # The pinned game facts stand in for the ROM: same build id (the ROM SHA-256) as the engine job's ROM.
          from emerald_multiplayer.companion import verify_rom_manifest
          assert manifest.get("game_facts") == "game-facts.json" and "game-facts.json" in manifest["files"]
          build, _ = verify_rom_manifest(runtime / "game-facts.json", runtime.parent / "game-manifest.json")
          assert build == manifest["rom_sha256"], "game facts and runtime pairing disagree"
          if os.environ["MODE"] == "full":
              assert build == os.environ["ENGINE_ROM_SHA256"], "packaged game facts are not the engine job's ROM"
          print("game facts: build", build)
          PY
      - name: Start the frozen launcher and watch it stay up
        shell: pwsh
        run: |
          $exe = Join-Path $env:WORK "launcher\dist\EmeraldTogether\EmeraldTogether.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "EmeraldTogether.exe exited early with code $($p.ExitCode)" }
          # Update 30: in the full package the first thing on screen is the in-game menu, i.e. the packaged game's own executable
          # running --shell (the earlier launcher window is only the fallback when that cannot start).
          $shell = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*--shell*" -and $_.ParentProcessId -eq $p.Id })
          if ($env:MODE -eq "full") {
            if ($shell.Count -ne 1) { throw "expected exactly one in-game menu process (game executable --shell) under EmeraldTogether.exe, found $($shell.Count)" }
            "in-game menu process: $($shell[0].Name) (pid $($shell[0].ProcessId))"
          } else { "smoke package: menu processes found: $($shell.Count)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path $env:WORK "launcher-screen.png"))
          Stop-Process -Id $p.Id -Force
          "launcher stayed up for 20 s (pid $($p.Id))"
      - name: Graphics mode check on the real packaged games (full)
        if: env.MODE == 'full'
        run: |
          runtime="$(.venv/Scripts/python -c "import pathlib,os;print(next(pathlib.Path(os.environ['WORK'],'launcher/dist/EmeraldTogether').rglob('runtime.json')).parent)")"
          .venv/Scripts/python scripts/windows-runtime/ci_graphics_check.py "$runtime" "$WORK/graphics-check"
      - name: In-game menu check on the real packaged games (full)
        if: env.MODE == 'full'
        run: |
          runtime="$(.venv/Scripts/python -c "import pathlib,os;print(next(pathlib.Path(os.environ['WORK'],'launcher/dist/EmeraldTogether').rglob('runtime.json')).parent)")"
          .venv/Scripts/python scripts/windows-runtime/ci_shell_check.py "$runtime" "$WORK/shell-check"
      - name: Summary
        run: |
          {
            echo "### Windows package"
            echo "- Mode: $MODE"
            [ "$MODE" = full ] && echo "- Engine commit: \`${{ needs.engine.outputs.engine_commit }}\`"
            [ "$MODE" = full ] && echo "- Game ROM sha256: \`${{ needs.engine.outputs.rom_sha256 }}\`"
            echo "- Sprite pack in the runtime: $HAVE_SPRITES"
            echo "- Import of the owner's own game enabled: $HAVE_BASE (not needed: the package pins its game facts)"
            echo "- Archive sha256: \`$(.venv/Scripts/python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$WORK/launcher/EmeraldTogether.zip")\`"
            echo "- Installer: \`$(.venv/Scripts/python -c "import json,sys;r=json.load(open(sys.argv[1]));print(r['setup'], r['setup_sha256'])" "$WORK/launcher/installer.json")\` (artifact $INSTALLER_ARTIFACT; unsigned)"
            echo "- Private development preview; clean-PC, gameplay and network acceptance are separate."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the player's installer (private to this repository, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INSTALLER_ARTIFACT }}
          path: ${{ env.WORK }}/launcher/player/
          retention-days: 7
          if-no-files-found: error
      - name: Hand the package hashes to the installation check (one day)
        uses: actions/upload-artifact@v4
        with:
          name: installer-check-inputs-${{ env.MODE }}
          path: |
            ${{ env.WORK }}/launcher/package-hashes.json
            ${{ env.WORK }}/launcher/installer.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload the developer package (private to this repository, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldTogether-windows-${{ env.MODE }}
          path: |
            ${{ env.WORK }}/launcher-screen.png
            ${{ env.WORK }}/graphics-check/graphics-check.json
            ${{ env.WORK }}/shell-check/shell-check.json
            ${{ env.WORK }}/shell-check/3d/menu.png
            ${{ env.WORK }}/shell-check/2d/menu.png
            ${{ env.WORK }}/launcher/EmeraldTogether.zip
            ${{ env.WORK }}/launcher/package-hashes.json
            ${{ env.WORK }}/launcher/package-audit.json
            ${{ env.WORK }}/launcher/installer.json
            ${{ env.WORK }}/launcher/installer.log
            ${{ env.WORK }}/launcher/build.log
          retention-days: 7
          if-no-files-found: warn
      - name: Remove private inputs from the runner
        if: always()
        run: rm -rf inputs "$WORK"

  install-check:
    name: Installation check (silent install, start, repair, uninstall)
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    # Always a fresh GitHub-hosted runner, never the owner's PC: this installs and uninstalls for the runner's user.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ inputs.mode || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/windows-runtime
            src
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.INSTALLER_ARTIFACT }}
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: installer-check-inputs-${{ env.MODE }}
          path: check-inputs
      - name: Install silently, check the files, start it, repair over it, uninstall it
        run: |
          setup="$(ls installer/EmeraldTogether-Setup-*.exe)"
          [ "$(ls installer | wc -l)" -eq 2 ] && [ -f installer/QUICK-START.txt ] || { ls -la installer; exit 1; }
          expect=(); [ "$MODE" = full ] && expect=(--expect-shell)
          # LOCALAPPDATA for everything the check starts is a temporary profile inside this folder;
          # a sentinel planted in its PokemonPrivate must survive the uninstall.
          python scripts/windows-runtime/ci_installer_check.py --setup "$setup" \
            --hashes check-inputs/package-hashes.json --work "$RUNNER_TEMP/install-check" "${expect[@]}"
      - name: Create World on the installed build, through its menu window (full)
        if: env.MODE == 'full'
        # scripts/windows-runtime/ci_world_check.py: Host World > Create World on the default network and with a public
        # address, invite code, rename, delete, hosting up to the game opening, and a restart (the 2026-10-19 crash).
        run: |
          python scripts/windows-runtime/ci_world_check.py --setup "$(ls installer/EmeraldTogether-Setup-*.exe)" \
            --work "$RUNNER_TEMP/world-check" --profile "$RUNNER_TEMP/world-check/profile" --expect fixed --label fresh
      - name: Create a character, Solo, Host World and Join Friend on the installed build (full)
        if: env.MODE == 'full'
        # scripts/windows-runtime/ci_play_check.py: two profiles on this runner, both menus open; New Game, Solo, a hosted world
        # on this runner's network address and a friend joining it with the copied invite code, every save in its world.
        run: |
          python scripts/windows-runtime/ci_play_check.py --setup "$(ls installer/EmeraldTogether-Setup-*.exe)" \
            --work "$RUNNER_TEMP/play-check" --label play
      - name: Upload the installation check report (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldTogether-installer-check-${{ env.MODE }}
          path: |
            ${{ runner.temp }}/install-check/installer-check.json
            ${{ runner.temp }}/install-check/install.log
            ${{ runner.temp }}/install-check/repair.log
            ${{ runner.temp }}/install-check/uninstall.log
            ${{ runner.temp }}/world-check/*-world-check.json
            ${{ runner.temp }}/world-check/*-pictures/
            ${{ runner.temp }}/play-check/*-play-check.json
            ${{ runner.temp }}/play-check/*-screens.jsonl
            ${{ runner.temp }}/play-check/*-pictures/
            ${{ runner.temp }}/play-check/*.log
          retention-days: 7
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          {
            echo "### Installation check ($MODE)"
            python -c "import json,sys;r=json.load(open(sys.argv[1]));print('- Result:', r.get('result')); [print('-', s['step']) for s in r['steps']]" \
              "$RUNNER_TEMP/install-check/installer-check.json" 2>/dev/null || echo "- no report (see the log)"
            for f in "$RUNNER_TEMP"/world-check/*-world-check.json; do
              [ -f "$f" ] || continue
              python -c "import json,sys;r=json.load(open(sys.argv[1]));print('- Create World on the installed build:', r['result']);[print('  -', l) for l in r['log']]" "$f"
            done
            for f in "$RUNNER_TEMP"/play-check/*-play-check.json; do
              [ -f "$f" ] || continue
              python -c "import json,sys;r=json.load(open(sys.argv[1]));print('- Create a character, Solo, Host World, Join Friend:', r['result']);[print('  -', l) for l in r['log']]" "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
