    # The wireless minigames between a world's players (KNOWN_ISSUES MS-141c) in real Windows game processes (a
    # GitHub-hosted runner, one PC on its own loopback): each player's launcher, the world server and the Classic 2D
    # game it packages (scripts/multiplayer/native_launcher_minigame_proof.py, Windows mode: keys as the keyboard's
