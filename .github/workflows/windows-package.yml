          path: inputs
      - uses: actions/download-artifact@v8
        with:
          name: mega-check-inputs
          path: mega-check-inputs
      - uses: actions/download-artifact@v8
        with:
          name: classic-pe-symbols
          path: symbols
      - uses: actions/download-artifact@v8
        with:
          name: classic-linux-sizes
          path: symbols
      - name: New characters from the game's own short introduction, then their minigame fixtures
        run: |
          if [ ! -f symbols/minigame-facts.json ]; then echo "::notice::this engine has no minigame facts"; exit 0; fi
          .venv/Scripts/python scripts/multiplayer/make_intro_saves.py --exe mega-check-inputs/pokeemerald-mp-bfxtest.exe \
            --mega-check mega-check-inputs/mega_check.py --out "$RUNNER_TEMP/intro" --count ${{ matrix.count }}
          more=()
          if [ "${{ matrix.count }}" -ge 3 ]; then more+=(--source-c "$RUNNER_TEMP/intro/boy-2.sav"); fi
          if [ "${{ matrix.count }}" -ge 4 ]; then more+=(--source-d "$RUNNER_TEMP/intro/girl-2.sav"); fi
          .venv/Scripts/python scripts/multiplayer/make_tower_saves.py --exe mega-check-inputs/pokeemerald-mp-bfxtest.exe \
