          - {activity: pokemon_jump, count: 2, fixtures: "jump-a,jump-b", a: jump-a, b: jump-b}
          - {activity: dodrio, count: 3, fixtures: "dodrio-a,dodrio-b,dodrio-c", a: dodrio-a, b: dodrio-b, c: dodrio-c}
          - {activity: berry_crush, count: 4, fixtures: "crush-a,crush-b,crush-c,crush-d", a: crush-a, b: crush-b,
             c: crush-c, d: crush-d}
          - {activity: pokemon_jump, count: 4, fixtures: "jump-a,jump-b,jump-c,jump-d", a: jump-a, b: jump-b, c: jump-c,
             d: jump-d}
          - {activity: dodrio, count: 4, fixtures: "dodrio-a,dodrio-b,dodrio-c,dodrio-d", a: dodrio-a, b: dodrio-b,
             c: dodrio-c, d: dodrio-d}
    defaults:
      run:
        shell: bash
    steps:
      - name: Both builds come from one engine commit
        run: |
          [ "${{ needs.engine.outputs.engine_commit }}" = "${{ needs.symbol-sizes.outputs.engine_commit }}" ] || {
