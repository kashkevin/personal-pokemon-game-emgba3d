# Windows package: builds the launcher with the repository's pinned wheels
# (build_launcher.py, PyInstaller 6.22.3) on a Windows runner, packs it into the player's
# installer (Inno Setup, scripts/windows-runtime/installer/EmeraldTogether.iss) and checks that
# installer on a fresh GitHub-hosted runner (docs/windows-installation.md).
#
#   smoke (default; also runs on a push that touches the packaging files): synthetic,
#          asset-free inputs (scripts/windows-runtime/make_smoke_inputs.py). Needs no engine,
#          secrets, ROM or sprite pack; proves collect_native_bundle (with game facts),
#          build_launcher, PyInstaller, the package audit, the installer build, that the frozen
#          launcher starts, and the silent install / start / repair / uninstall check.
#   full   (manual): builds the game from the private engine first, then the same steps with
#          the real game. Needs the secrets listed in docs/windows-ci-packaging.md.
#          `only` (check job ids, comma-separated) runs the builds and those checks, no installer:
#          failures looked at again without the whole run; with abandon-check, `abandon_scenario` and
#          `attempts` run one scenario (or all) up to four times side by side. A release run
#          leaves all three at their defaults.
#
# Artifacts: EmeraldTogether-Windows-Installer (full; "-smoke-test" in smoke mode) holds only
# what a friend downloads - the Setup file and QUICK-START.txt. EmeraldTogether-windows-<mode>
# is the developer artifact (zip, hashes, audit, reports, screenshots). EmeraldTogether-mega-check
# (full) is the Mega Evolution check's report: real Windows game processes of a test build that is
# never packaged (Makefile_pc BFX_TEST=1, the Classic 2D game with the battle test driver);
# EmeraldTogether-feature-check (full) is the same build's starter, soft reset and reroll check.
# EmeraldTogether-multiplayer-check-* (full) are the multiplayer gameplay proofs' records (evidence.json): two to four
# players through the whole launcher with the Classic 2D game it packages, in real Windows game processes.
# Nothing here is published: no release, no Pages, no cache of game data; artifacts are
# private to the repository. The package never contains a .gba, save or database.
name: windows-package

on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke (synthetic inputs, no secrets) or full (the real game from the private engine)
        type: choice
        options: [smoke, full]
        default: smoke
      engine_ref:
        description: "full: engine branch, tag or commit to build"
        default: claude/emeraldtogether-combined
      version:
        description: Version label shown in the launcher (blank = "Native 3D CI <run number>")
        default: ""
      runner:
        description: windows-2022 (GitHub-hosted) or self-hosted (your own PC; private files stay on it)
        type: choice
        options: [windows-2022, self-hosted]
        default: windows-2022
      expected_rom_sha256:
        description: "full: fail unless the built game ROM has this SHA-256 (blank = just report it)"
        default: ""
      gameplay_qa:
        description: "full: also the whole game's gameplay check in Windows game processes (every trainer, person, item, sign, hidden item, warp, trigger; 8 runners, hours)"
        type: choice
        options: ["no", "yes"]
        default: "no"
      upgrade_from_run:
        description: "full: the id of an earlier full run whose installer the installation check updates from (it plays a world with it, installs this run's installer over it and plays on from those saves); blank = no update check"
        default: ""
      only:
        description: "full: only these check jobs after the builds (job ids, comma-separated, e.g. abandon-check,rival-proof; no-climb: tower-proof without its climb; tower:<entry>, mp:<entry>: those entries alone; blank = every job, the installer too)"
        default: ""
      abandon_scenario:
        description: "full: the interrupted-battle check's scenario (all = the seven)"
        type: choice
        options: [all, pairs-crash, multi-network, ffa-exit, ffa-host-crash, ffa-knockout, multi-knockout, stale-save]
        default: all
      attempts:
        description: "full: how many times the interrupted-battle check runs each scenario, side by side (a failure that comes and goes)"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
  push:
    paths:
      - .github/workflows/windows-package.yml
      - scripts/windows-runtime/**
      - requirements-host-provisioning.txt
      - src/emerald_multiplayer/launcher*.py
      - src/emerald_multiplayer/player_runtime.py
      - src/emerald_multiplayer/graphics_mode.py
      - src/emerald_multiplayer/game_facts.py
      - src/emerald_multiplayer/installation_check.py

permissions:
  contents: read

env:
  SDL_VERSION: "2.30.7"
  SDL_SHA256: 147c3dc03c9be6b23e625fd877421098e93487f1f55e0e1d4e3ce571e79b91c4
  # The owner's Emerald USA/Europe revision 0 dump (docs/release-patch-creation.md); a public identity.
  BASE_ROM_SHA256: a9dec84dfe7f62ab2220bafaef7479da0929d066ece16a6885f6226db19085af
  # GitHub's windows-2022 image ships Inno Setup 6.7.1 as `iscc` (runner-images Windows2022-Readme);
  # a runner without it installs exactly this version from Chocolatey.
  INNO_SETUP_VERSION: "6.7.1"
  # The player-facing artifact: only the Setup file and QUICK-START.txt.
  INSTALLER_ARTIFACT: ${{ (inputs.mode || 'smoke') == 'full' && 'EmeraldTogether-Windows-Installer' || 'EmeraldTogether-Windows-Installer-smoke-test' }}

jobs:
  engine:
    name: Build the game (Linux cross-compile)
    if: ${{ (inputs.mode || 'smoke') == 'full' }}
    runs-on: ubuntu-24.04
    outputs:
      engine_commit: ${{ steps.build.outputs.engine_commit }}
      rom_sha256: ${{ steps.build.outputs.rom_sha256 }}
      exe_sha256: ${{ steps.build.outputs.exe_sha256 }}
      classic_exe_sha256: ${{ steps.build.outputs.classic_exe_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
      - name: Check out the private engine
        uses: actions/checkout@v7
        with:
          repository: kashkevin/personal-pokemon-game-emgba3d-engine
          ref: ${{ inputs.engine_ref }}
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          # apt-get update once hung with no output for an hour on a hosted runner (windows-package runs 153 and 156,
          # 2026-10-22): network timeouts, and three tries of at most five minutes each.
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            timeout 300 sudo apt-get update -qq && break
            [ "$attempt" = 3 ] && { echo "apt-get update failed three times" >&2; exit 1; }
            echo "apt-get update stalled or failed (attempt $attempt): again" >&2
          done
          # The install itself then stalled for its whole 20 minutes (runs 175, 180 and 183, 2026-10-23), with no output.
          # dpkg's man-db trigger is a known stall on hosted runners (it rebuilds the manual index after every install):
          # skip it; and try three times, at most seven minutes each (apt keeps what it already downloaded).
          # It stalled again three times with no output (runs 280 and 282, 2026-11-04; 38 to 72 s when it works): the
          # packages are now fetched first and installed after, each part saying what it does, and a part that runs
          # out of time first shows apt's and dpkg's processes and logs, so the next stall names its step.
          sudo rm -f /var/lib/man-db/auto-update
          packages="build-essential libpng-dev gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi mingw-w64 gdb"
          apt_state() {
            echo "--- apt and dpkg after attempt $1:" >&2
            ps -eo pid,etimes,stat,args | grep -E '[a]pt|[d]pkg|[u]nattended' >&2 || true
            sudo tail -n 15 /var/log/apt/term.log >&2 || true
            sudo ls -la /var/cache/apt/archives/partial >&2 || true
          }
          for attempt in 1 2 3; do
            timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --download-only \
              --no-install-recommends -o DPkg::Lock::Timeout=120 $packages && break
            apt_state "$attempt (download)"
            [ "$attempt" = 3 ] && { echo "apt-get install --download-only failed three times" >&2; exit 1; }
            echo "apt-get install --download-only stalled or failed (attempt $attempt): again" >&2
          done
          for attempt in 1 2 3; do
            timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-download --no-install-recommends \
              -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=120 $packages && break
            apt_state "$attempt (install)"
            [ "$attempt" = 3 ] && { echo "apt-get install failed three times" >&2; exit 1; }
            echo "apt-get install stalled or failed (attempt $attempt): again" >&2
            sudo dpkg --configure -a || true
          done
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: \
            -r app/requirements-host-provisioning.txt
          # The engine's build tools (graphics, Diorama rules, ABI checks) import Pillow, NumPy and pyelftools.
          python -m venv .tools
          .tools/bin/python -m pip install --only-binary=:all: -r app/requirements-dev.txt
      - name: SDL2 for MinGW (pinned)
        run: |
          curl -fsSL -o sdl.tgz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-devel-${SDL_VERSION}-mingw.tar.gz"
          echo "${SDL_SHA256}  sdl.tgz" | sha256sum -c -
          mkdir sdl && tar -xzf sdl.tgz -C sdl
      - name: Build the GBA ROM, the Windows 3D game and the Classic 2D game
        id: build
        working-directory: engine
        env:
          # only: package (an installer and nothing else): the test builds the check jobs use are left out
          QUICK: ${{ inputs.only == 'package' && '1' || '' }}
        run: |
          export PATH="$GITHUB_WORKSPACE/.tools/bin:$PATH"
          make -j"$(nproc)" BUILD_NAME=dev
          make -f Makefile_pc SDL_DIR="$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32" DIORAMA=1 -j"$(nproc)"
          # PC-only battle features (the free-for-all) advertise themselves in the native game, not in the GBA ROM.
          i686-w64-mingw32-nm --print-size --defined-only pokeemerald-mp-diorama.exe > native-symbols.txt
          # The Tower's 3D UI proof reads the 3D game's memory at its symbols: the table before the strip.
          mkdir -p ../classic-pe-symbols
          i686-w64-mingw32-nm -n pokeemerald-mp-diorama.exe > ../classic-pe-symbols/pokeemerald-mp-diorama.nm.txt
          i686-w64-mingw32-strip --strip-all pokeemerald-mp-diorama.exe
          # The Classic 2D game: the same engine without DIORAMA=1 (Graphics mode in the launcher).
          make -f Makefile_pc SDL_DIR="$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32" -j"$(nproc)"
          # The multiplayer gameplay job reads the running games' memory at their symbols: the table before the strip.
          mkdir -p ../classic-pe-symbols
          i686-w64-mingw32-nm -n pokeemerald-mp.exe > ../classic-pe-symbols/pokeemerald-mp.nm.txt
          # ... and the Mega Evolution proof the battle structures' offsets of this very build (gdb reads its debug
          # information; MinGW's layout is not the Linux build's).
          python ../app/scripts/multiplayer/mega_facts.py --game pokeemerald-mp.exe --out ../classic-pe-symbols/mega-facts.json
          # ... and the wireless minigames' proof its functions, variables and structures (an engine without the
          # minigames between players has none: the minigame-proof job then says so and passes)
          python ../app/scripts/multiplayer/minigame_facts.py --game pokeemerald-mp.exe --pe \
            --out ../classic-pe-symbols/minigame-facts.json \
            || echo "::warning::no minigame facts (an engine without the wireless minigames between players?)"
          i686-w64-mingw32-strip --strip-all pokeemerald-mp.exe
          if [ -z "$QUICK" ]; then
          # The Mega Evolution check's test build (never packaged): the Classic 2D game with the battle test driver.
          make -f Makefile_pc SDL_DIR="$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32" BFX_TEST=1 -j"$(nproc)"
          # The Tower's 100-floor climb runs this test build through the launcher: its symbol table before the strip.
          i686-w64-mingw32-nm -n pokeemerald-mp-bfxtest.exe > ../classic-pe-symbols/pokeemerald-mp-bfxtest.nm.txt
          i686-w64-mingw32-strip --strip-all pokeemerald-mp-bfxtest.exe
          # The 3D game's test build (never packaged): the 3D battles and Mega forms drawn on a Windows runner through
          # Mesa's software OpenGL (the graphics-3d job; the hosted runner's own OpenGL is 1.1).
          make -f Makefile_pc SDL_DIR="$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32" DIORAMA=1 BFX_TEST=1 -j"$(nproc)"
          i686-w64-mingw32-strip --strip-all pokeemerald-mp-diorama-bfxtest.exe
          mkdir -p ../diorama-check-inputs
          cp pokeemerald-mp-diorama-bfxtest.exe "$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32/bin/SDL2.dll" ../diorama-check-inputs/
          # The world-geometry probe (step 16, tools/qa/geometry_check.py) for the graphics-3d job's pictures, at the
          # engine's paths: it imports mega_check and the map inventory from them, and reads the 3D rules' header
          # when it starts (run 244 stopped there without it). From an engine that has it.
          if [ -f tools/qa/geometry_check.py ]; then
            mkdir -p ../diorama-check-inputs/geo/tools/qa ../diorama-check-inputs/geo/tools/battle_env \
              ../diorama-check-inputs/geo/include/diorama
            cp tools/qa/geometry_check.py tools/qa/geometry_inventory.py tools/qa/inventory.py ../diorama-check-inputs/geo/tools/qa/
            cp tools/battle_env/mega_check.py ../diorama-check-inputs/geo/tools/battle_env/
            cp include/diorama/rules.h ../diorama-check-inputs/geo/include/diorama/
          fi
          mkdir -p ../mega-check-inputs
          cp pokeemerald-mp-bfxtest.exe tools/battle_env/mega_check.py tools/battle_env/feature_check.py ../mega-check-inputs/
          # Battle Tower: Legends' floor check and its floor table, from an engine that has the Tower.
          if [ -f src/tower_legends.c ]; then
            cp tools/battle_env/tower_check.py tools/tower_legends/tower_legends.json ../mega-check-inputs/
            if [ -f tools/battle_env/train_check.py ]; then cp tools/battle_env/train_check.py ../mega-check-inputs/; fi
            # Step 18: a Championship match against a computer trainer (the solo command's mode 2), from an engine with it.
            if [ -f tools/battle_env/championship_check.py ]; then cp tools/battle_env/championship_check.py ../mega-check-inputs/; fi
          fi
          # Breeding and egg hatching through the Day Care man and the field, from an engine that has the check.
          if [ -f tools/battle_env/breed_check.py ]; then cp tools/battle_env/breed_check.py ../mega-check-inputs/; fi
          # Evolutions (a Rare Candy, stopped with B, a stone, after a battle), from an engine that has the check.
          if [ -f tools/battle_env/evolve_check.py ]; then cp tools/battle_env/evolve_check.py ../mega-check-inputs/; fi
          # The crash report (MS-71): the test build crashes on purpose, from an engine that has the check.
          if [ -f tools/battle_env/crash_check.py ]; then cp tools/battle_env/crash_check.py ../mega-check-inputs/; fi
          # A Poke Mart's purchase and sale with money, from an engine that has the check.
          if [ -f tools/battle_env/shop_check.py ]; then cp tools/battle_env/shop_check.py ../mega-check-inputs/; fi
          # Wild Pokemon caught (into the party, into the PC), from an engine that has the check.
          if [ -f tools/battle_env/catch_check.py ]; then cp tools/battle_env/catch_check.py ../mega-check-inputs/; fi
          # Move switching, shiny wild Pokemon seen before the battle and the Game Corner's RARE GOODS (the feature-checks
          # job), from an engine that has the checks.
          for check in move_switch_check shiny_check; do
            if [ -f tools/battle_env/$check.py ]; then cp tools/battle_env/$check.py ../mega-check-inputs/; fi
          done
          # The Acro Bike on the Safari Zone South's rails (the feature-checks job; KNOWN_ISSUES MS-171), beside the
          # mega_check it imports, from an engine that has the check.
          if [ -f tools/battle_env/acro_check.py ]; then cp tools/battle_env/acro_check.py ../mega-check-inputs/; fi
          # Fly from the Town Map (the feature-checks job; the owner's request of 2026-10-31), beside mega_check too.
          if [ -f tools/battle_env/flymap_check.py ]; then cp tools/battle_env/flymap_check.py ../mega-check-inputs/; fi
          # The RARE GOODS check reads the generated lists and the item numbers from the engine's own files, three folders
          # above itself (run 219 found none on the runner): it goes with those files at their engine paths.
          if [ -f tools/battle_env/casino_check.py ]; then
            for file in tools/battle_env/casino_check.py tools/battle_env/mega_check.py include/constants/items.h \
                src/platform/mp_rare_goods_prices.h data/scripts/mp_rare_goods_shop.inc; do
              mkdir -p "../mega-check-inputs/casino/$(dirname "$file")"
              cp "$file" "../mega-check-inputs/casino/$file"
            done
            # The Rotom Catalog's check (bought at RARE GOODS, its forms; the owner's request of 2026-10-30) reads the
            # same engine files: it sits with them.
            if [ -f tools/battle_env/rotom_check.py ]; then
              cp tools/battle_env/rotom_check.py ../mega-check-inputs/casino/tools/battle_env/
            fi
            # The TM catalogue's check (the owner's TM request of 2026-10-31: bought at the TM counter, SOLD OUT, saved and
            # loaded, the TM PRIZES, taught from the Bag) reads the catalogue's lists and the move numbers too.
            if [ -f tools/battle_env/tm_catalogue_check.py ]; then
              for file in tools/battle_env/tm_catalogue_check.py include/constants/moves.h \
                  data/scripts/mp_tm_catalogue_lists.inc; do
                mkdir -p "../mega-check-inputs/casino/$(dirname "$file")"
                cp "$file" "../mega-check-inputs/casino/$file"
              done
            fi
            # The item hub (2026-10-31): the RARE GOODS and the Rotom Catalog's checks read the hub's lists since then, and
            # the hub's own check (Master Balls, the Town Map, Mega Stones without a ring, a TM through the hub) too.
            if [ -f data/scripts/mp_item_hub_lists.inc ]; then
              for file in data/scripts/mp_item_hub_lists.inc src/platform/mp_item_hub.h tools/battle_env/item_hub_check.py; do
                if [ -f "$file" ]; then
                  mkdir -p "../mega-check-inputs/casino/$(dirname "$file")"
                  cp "$file" "../mega-check-inputs/casino/$file"
                fi
              done
            fi
          fi
          # The rival checkpoints and the short introduction through the game's own scripts (the rival-check job): the
          # flag and variable numbers from this engine's headers, as the Windows runner has none.
          if grep -q -- "--write-facts" tools/pc_port/rival_check.py 2>/dev/null; then
            cp tools/pc_port/rival_check.py ../mega-check-inputs/
            python3 tools/pc_port/rival_check.py --write-facts ../mega-check-inputs/rival-facts.json
          fi
          # The whole game's gameplay check: its plan from this engine's data (the maps a player can reach), for the
          # Windows shard jobs (they run the test build above; no engine checkout there).
          mkdir -p ../gameplay-inputs/tools/qa ../gameplay-inputs/tools/battle_env
          if [ -f tools/qa/gameplay_check.py ]; then
            cp tools/qa/gameplay_check.py tools/qa/inventory.py ../gameplay-inputs/tools/qa/
            cp tools/battle_env/mega_check.py ../gameplay-inputs/tools/battle_env/
            python3 tools/qa/gameplay_check.py --exe pokeemerald-mp-bfxtest.exe --plan-only --out ../gameplay-inputs/plan
            # The reset-guarded static encounters offline (KNOWN_ISSUES MS-156; the feature-checks job): their plan and
            # the story state they need, from an engine that has the option.
            if grep -q -- "--static-encounters" tools/qa/gameplay_check.py; then
              python3 tools/qa/gameplay_check.py --exe pokeemerald-mp-bfxtest.exe --plan-only --static-encounters \
                --out ../gameplay-inputs/static-plan
            fi
          fi
          cp "$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32/bin/SDL2.dll" ../mega-check-inputs/
          fi
          rom_sha="$(sha256sum pokedev.gba | cut -d' ' -f1)"
          if [ -n "${{ inputs.expected_rom_sha256 }}" ] && [ "$rom_sha" != "${{ inputs.expected_rom_sha256 }}" ]; then
            echo "ROM sha256 $rom_sha differs from the expected pin" >&2; exit 1
          fi
          commit="$(git rev-parse HEAD)"
          echo "engine_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "rom_sha256=$rom_sha" >> "$GITHUB_OUTPUT"
          echo "exe_sha256=$(sha256sum pokeemerald-mp-diorama.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "classic_exe_sha256=$(sha256sum pokeemerald-mp.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          mkdir -p ../native-inputs
          cp pokeemerald-mp-diorama.exe pokeemerald-mp.exe pokedev.gba ../native-inputs/
          cp "$GITHUB_WORKSPACE/sdl/SDL2-${SDL_VERSION}/i686-w64-mingw32/bin/SDL2.dll" ../native-inputs/
          # The 3D battle effects the game reads beside its executable (without them every move plays its GBA animation).
          cp -r battlefx ../native-inputs/battlefx
          PYTHONPATH="$GITHUB_WORKSPACE/app/src" "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/app/scripts/multiplayer/generate_manifest.py" \
            --rom pokedev.gba --elf pokedev.elf --engine-commit "$commit" --native-symbols native-symbols.txt --output ../native-inputs/manifest.json
          # Every PC-only marker the Windows game has must be in its manifest: without the presence detail the companion
          # refuses the game's pose off the field and closes its link (MinGW nm prints no symbol sizes; 2026-10-19).
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import json, re
          symbols = open("native-symbols.txt").read()
          manifest = json.load(open("../native-inputs/manifest.json"))
          markers = {"gMultiplayerBattleFfaAbiVersion": "battle_ffa_abi_version", "gMultiplayerRivalAbiVersion": "rival_abi_version",
                     "gMultiplayerBattleFfa3AbiVersion": "battle_ffa3_abi_version",
                     "gMultiplayerPresenceDetailAbiVersion": "presence_detail_abi_version",
                     "gMultiplayerMenuReleaseAbiVersion": "menu_release_abi_version",
                     "gMultiplayerSaveImportWindowAbiVersion": "save_import_window_abi_version",
                     "gMultiplayerSavePartyQueryAbiVersion": "save_party_query_abi_version",
                     "gMultiplayerTowerAbiVersion": "tower_abi_version",
                     "gMultiplayerHostSavePageAbiVersion": "host_save_page_abi_version",
                     "gMultiplayerBattlePeekAbiVersion": "battle_peek_abi_version",
                     "gMultiplayerBattleReceiveManyAbiVersion": "battle_receive_many_abi_version",
                     "gMultiplayerBattleDeliverAbiVersion": "battle_deliver_abi_version",
                     "gMultiplayerTowerNextPageAbiVersion": "tower_next_page_abi_version",
                     "gMultiplayerMenuNewPageAbiVersion": "menu_new_page_abi_version",
                     "gMultiplayerTradeEggAbiVersion": "trade_egg_abi_version",
                     "gMultiplayerTicketAbiVersion": "ticket_abi_version"}
          present = [field for symbol, field in markers.items() if re.search(rf"\s_?{symbol}$", symbols, re.M)]
          missing = [field for field in present if manifest.get(field) != 1]
          assert not missing, f"the Windows game has these markers but its manifest lacks {missing}"
          print("PC-only markers in the manifest:", present)
          PY
      - name: Hand the build to the Windows job (private, one day)
        uses: actions/upload-artifact@v7
        with:
          name: native-inputs
          path: native-inputs
          retention-days: 1
          if-no-files-found: error
      - name: Hand the Mega check's test build to its Windows job (private, one day)
        if: ${{ inputs.only != 'package' }}
        uses: actions/upload-artifact@v7
        with:
          name: mega-check-inputs
          path: mega-check-inputs
          retention-days: 1
          if-no-files-found: error
      - name: Hand the 3D test build to the graphics job (private, one day)
        if: ${{ inputs.only != 'package' }}
        uses: actions/upload-artifact@v7
        with:
          name: diorama-check-inputs
          path: diorama-check-inputs
          retention-days: 1
          if-no-files-found: error
      - name: Hand the gameplay check's plan to its Windows jobs (private, one day)
        if: ${{ inputs.only != 'package' }}
        uses: actions/upload-artifact@v7
        with:
          name: gameplay-inputs
          path: gameplay-inputs
          retention-days: 1
          if-no-files-found: warn
      - name: Hand the Classic game's symbol table to the multiplayer job (private, one day)
