    # Battle Tower: Legends through the whole launcher in real Windows game processes (a GitHub-hosted runner, one PC on
    # its own loopback): two players' launchers, the world server, the Classic 2D game it packages
    # (scripts/multiplayer/native_launcher_tower_proof.py, Windows mode). The characters come from the game's own short
    # introduction; the test build then gives them their Tower fixtures (scripts/multiplayer/make_tower_saves.py).
    # solo: floors 1-11 through the Players menu, each settled by the host, Brock's checkpoint prize and every floor's
    # money and BP in the next save, floor 10 replayed (nothing paid again), an HP Up bought in the Tower Shop
    # with 16 BP, and player 2 losing the special boss (Giovanni, floor 25) back to checkpoint 20; milestone: from a
    # record at floor 25, Giovanni beaten and his milestone Pokemon made in the game (into the PC), floor 25 replayed
    # (no second Pokemon), and player 2 losing floor 1 (no checkpoint yet);
    # duo: a team, the Duo invitation, both Ready, the native co-op battle won and settled for both; join: co-op
    # progression - player 1 (floors 1-11 cleared, three level-10 Mewtwo) joins player 2's Duo on player 2's floor 10:
    # floors 10 and 11 pay player 1 nothing while its Mewtwo gain experience and levels, player 2 is paid each first
    # clear, player 2's game closed and started again between them (its rewards arrive once), floor 12 pays both, and
    # after the world's host restarts both records are kept and nothing is paid again; join-reset: the same with player 2's
    # soft reset (START > PLAYER > RESET, back to its host save) in place of the close: floor 10's prize, received after
    # the save, arrives again exactly once;
    # mega: a Duo replay
    # of floor 40 where Norman's Kangaskhan Mega Evolves; forfeit: player 2's solo floor closed mid-battle (player 1
    # hosts the world, which stays up), the game started again, the floor counted as a loss on the next ask; ui: the 3D
    # game the launcher packages with its native PC UI, through Mesa's software OpenGL (pinned, as graphics-3d; added to
    # the proof's runtime only, never to the package): player 1 opens every Tower page and each is pictured; climb: both
    # players climb floors 1-100 at once in the engine's test build through the launcher (PKMN_TEST_TOWER_WIN: the lead's
    # HP refilled each turn, in memory only), every floor settled by the host, and at the end each save holds every
    # first-clear prize, every floor's money and BP, the four milestone Pokemon (in the PC) and the record P 101, H 100.
    name: Battle Tower in the launcher (Windows game processes, ${{ matrix.name }})
    needs: [engine, symbol-sizes]
    if: ${{ (inputs.mode || 'smoke') == 'full' && (!inputs.only || contains(format(',{0},', inputs.only), ',tower-proof,')) }}
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.name == 'climb' && 330 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: solo, scenario: solo, a: tower-strong-a, b: tower-weak25-b, extra: "--weak-b --party-counts 6 1"}
          - {name: milestone, scenario: solo, a: tower-strong25-a, b: tower-weak-b, extra: "--weak-b --party-counts 6 1 --floors 26"}
          - {name: duo, scenario: duo, a: tower-strong-a, b: tower-strong-b, extra: "--party-counts 6 6"}
          - {name: join, scenario: join, a: tower-join-a, b: tower-join-b, extra: "--party-counts 3 6"}
          - {name: join-reset, scenario: join, a: tower-join-a, b: tower-join-b, extra: "--party-counts 3 6 --rejoin reset"}
          - {name: mega, scenario: mega, a: tower-mega-a, b: tower-mega-b, extra: "--party-counts 6 6 --floors-json mega-check-inputs/tower_legends.json"}
          - {name: forfeit, scenario: forfeit, a: tower-strong-a, b: tower-forfeit-b, extra: "--party-counts 6 6"}
          # the climb's test build and advantage: both players are level 100, so their computer trainers are floors 95-100
          - {name: championship, scenario: championship, a: tower-strong-a, b: tower-strong-b, extra: "--party-counts 6 6 --test-env PKMN_TEST_TOWER_WIN=1", game: mega-check-inputs/pokeemerald-mp-bfxtest.exe}
          - {name: ui, scenario: ui, a: tower-strong-a, b: tower-strong-b, extra: "--party-counts 6 6 --native-ui", game: inputs/pokeemerald-mp-diorama.exe, mesa: "yes"}
          - {name: climb, scenario: climb, a: tower-fast-a, b: tower-fast-b, extra: "--party-counts 6 6 --test-env PKMN_TEST_TOWER_WIN=1", game: mega-check-inputs/pokeemerald-mp-bfxtest.exe}
    defaults:
      run:
        shell: bash
    steps:
      - name: Both builds come from one engine commit
        run: |
          [ "${{ needs.engine.outputs.engine_commit }}" = "${{ needs.symbol-sizes.outputs.engine_commit }}" ] || {
            echo "the Windows game and the Linux symbol sizes are of different engine commits" >&2; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Private virtual environment with the pinned, hashed wheels
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --require-hashes --only-binary=:all: -r requirements-host-provisioning.txt
      - uses: actions/download-artifact@v8
        with:
          name: native-inputs
          path: inputs
      - uses: actions/download-artifact@v8
        with:
          name: mega-check-inputs
          path: mega-check-inputs
      - uses: actions/download-artifact@v8
        with:
          name: classic-pe-symbols
          path: symbols
      - uses: actions/download-artifact@v8
        with:
          name: classic-linux-sizes
          path: symbols
      - name: Two new characters from the game's own short introduction, then their Tower fixtures
        if: ${{ !contains(inputs.only, 'tower:') || contains(format(',{0},', inputs.only), format(',tower:{0},', matrix.name)) }}
        run: |
          if [ ! -f mega-check-inputs/tower_check.py ]; then echo "::notice::this engine has no Battle Tower"; exit 0; fi
          .venv/Scripts/python scripts/multiplayer/make_intro_saves.py --exe mega-check-inputs/pokeemerald-mp-bfxtest.exe \
            --mega-check mega-check-inputs/mega_check.py --out "$RUNNER_TEMP/intro" --count 2
          .venv/Scripts/python scripts/multiplayer/make_tower_saves.py --exe mega-check-inputs/pokeemerald-mp-bfxtest.exe \
            --mega-check mega-check-inputs/mega_check.py --source-a "$RUNNER_TEMP/intro/boy-1.sav" \
            --source-b "$RUNNER_TEMP/intro/girl-1.sav" --out "$RUNNER_TEMP/tower-saves" --only ${{ matrix.a }},${{ matrix.b }}
      - name: Mesa's software OpenGL (32-bit) for the 3D game (pinned; the ui pages)
        if: ${{ matrix.mesa == 'yes' }}
        shell: pwsh
        env:
          MESA_VERSION: "26.2.4"
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          $name = "mesa3d-$env:MESA_VERSION-release-msvc.7z"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/$name" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MESA_SHA256) { throw "$name has sha256 $hash, not the pinned $env:MESA_SHA256" }
          $unpacked = Join-Path $env:RUNNER_TEMP "mesa"
          & 7z x $archive "-o$unpacked" "x86\*.dll" -y | Out-Null
          New-Item -ItemType Directory -Force mesa | Out-Null
          foreach ($dll in @("opengl32.dll", "libgallium_wgl.dll", "libglapi.dll")) {
            $source = Join-Path $unpacked "x86\$dll"
            if (Test-Path $source) { Copy-Item $source mesa\ }
          }
          if (-not (Test-Path mesa\opengl32.dll)) { throw "Mesa's 32-bit opengl32.dll is missing" }
      - name: The Battle Tower (${{ matrix.name }})
        # only: ...,no-climb skips the climb's three hours (a quick run of the other entries)
        # only: ...,tower:<entry>,...: those entries alone (a quick check)
        if: ${{ (matrix.name != 'climb' || !contains(format(',{0},', inputs.only), ',no-climb,'))
                && (!contains(inputs.only, 'tower:') || contains(format(',{0},', inputs.only), format(',tower:{0},', matrix.name))) }}
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          if [ ! -f mega-check-inputs/tower_check.py ]; then echo "::notice::this engine has no Battle Tower"; exit 0; fi
          if [ "${{ matrix.scenario }}" = championship ] && [ ! -f mega-check-inputs/championship_check.py ]; then
            echo "::notice::this engine has no Championship computer matches (step 18)"; exit 0
          fi
          game="${{ matrix.game || 'inputs/pokeemerald-mp.exe' }}"
          name="$(basename "$game" .exe)"
          runtime_extra=()
          for dll in mesa/*.dll; do if [ -f "$dll" ]; then runtime_extra+=(--runtime-extra "$dll"); fi; done
          .venv/Scripts/python scripts/multiplayer/native_launcher_tower_proof.py --scenario ${{ matrix.scenario }} \
            --game "$game" --sdl inputs/SDL2.dll --rom inputs/pokedev.gba \
            --manifest inputs/manifest.json --pe-symbols "symbols/$name.nm.txt" \
            --sizes symbols/pokeemerald-mp.sizes.txt --slow 1.5 "${runtime_extra[@]}" \
            --source-a "$RUNNER_TEMP/tower-saves/${{ matrix.a }}.sav" --source-b "$RUNNER_TEMP/tower-saves/${{ matrix.b }}.sav" \
            ${{ matrix.extra }} --output "$RUNNER_TEMP/multiplayer-proof/tower-${{ matrix.name }}"
      - name: The proof's own diagnosis, in this log (only when it failed; scripts/multiplayer/proof_failure_summary.py)
        if: failure()
        run: python scripts/multiplayer/proof_failure_summary.py "$RUNNER_TEMP/multiplayer-proof"
      - name: Upload the proof's record (private to this repository, 7 days; no save)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: EmeraldTogether-tower-proof-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/multiplayer-proof/*/evidence.json
            ${{ runner.temp }}/multiplayer-proof/*/*.jsonl
            ${{ runner.temp }}/multiplayer-proof/*/*.png
            ${{ runner.temp }}/tower-saves/run-*/test.log
          retention-days: 7
          if-no-files-found: warn

