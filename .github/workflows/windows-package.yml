    # saves on the host with its result waiting, then the friend's game is closed (WM_CLOSE) with the award in its
    # memory only, its launcher started again, and the award given again from that save: the same experience, once;
    # both host saves after the scripts, then a fresh Continue and the store's integrity check.
    name: Co-op experience across a closed game (Windows game processes)
    needs: [engine, symbol-sizes]
    if: ${{ (inputs.mode || 'smoke') == 'full' && (!inputs.only || contains(format(',{0},', inputs.only), ',coop-proof,')) }}
    runs-on: windows-2022
