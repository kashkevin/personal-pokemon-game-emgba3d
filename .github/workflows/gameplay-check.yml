# Gameplay check (the final master update, phase 10): every trainer, person, item ball, sign, hidden item and warp of
# the Emerald game visited in a real game process - Linux, the Classic 2D test build (Makefile_pc NATIVE_LINUX=1
# BFX_TEST=1: the battle test driver's plan runner, never packaged) - and judged from the game's own log by the
# engine's tools/qa/gameplay_check.py: a trainer battle won with the beaten flag set, an item in the bag and the ball
# gone, a script that ran and gave the field back, the destination map reached. The build job writes the plan from
# the engine's data (the reachable maps of tools/qa/inventory.py); the shard jobs split it; the report job merges.
# Manual, and on a push that changes this file (a new workflow can only be dispatched once it is on the default
# branch). Artifacts are private to the repository: the test build and the plan for one day, the reports and the
# pictures of any hang for 7 days. Each job makes its own character from the game's short introduction; no save is
# kept or uploaded.
name: gameplay-check

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: engine branch or full commit to build
        default: claude/feature-update-engine
      kinds:
        description: comma-separated, of trainer,item,person,sign,hidden,warp
        default: trainer,item,person,sign,hidden,warp
      shards:
        description: parallel jobs (the plan split this many ways; at most 16)
        default: "8"
      speed:
        description: the game's clock this many times as fast (PKMN_TEST_SPEED, test builds)
        default: "4"
  push:
    paths:
      - .github/workflows/gameplay-check.yml

permissions:
  contents: read

jobs:
  build:
    name: Build the Linux test game and the plan
    runs-on: ubuntu-24.04
    # A clean Ubuntu 24.04: the runner image's own -dev packages keep the 32-bit SDL2 one from installing.
    container:
      image: ubuntu:24.04
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      engine_commit: ${{ steps.plan.outputs.engine_commit }}
    steps:
      - name: Toolchain (the native game is a 32-bit Linux program with SDL2)
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates \
            python3 python3-venv build-essential gcc-multilib libpng-dev pkg-config \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libsdl2-dev:i386
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Check out the private engine
        uses: actions/checkout@v4
        with:
          repository: kashkevin/personal-pokemon-game-emgba3d-engine
          ref: ${{ inputs.engine_ref || 'claude/feature-update-engine' }}
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - name: The engine's build tools (graphics, rules, ABI checks import Pillow, NumPy and pyelftools)
        run: |
          python3 -m venv .tools
          .tools/bin/python -m pip install -q --only-binary=:all: -r app/requirements-dev.txt
      - name: Build the GBA ROM's assets and the Classic 2D test game
        working-directory: engine
        run: |
          git config --global --add safe.directory "$PWD"
          export PATH="$GITHUB_WORKSPACE/.tools/bin:$PATH"
          make -j"$(nproc)" BUILD_NAME=dev
          echo "GBA ROM $(sha256sum pokedev.gba | cut -d' ' -f1)"
          make -f Makefile_pc NATIVE_LINUX=1 BFX_TEST=1 -j"$(nproc)"
          strip pokeemerald-mp-bfxtest
      - name: The plan
        id: plan
        working-directory: engine
        run: |
          mkdir -p ../gameplay-inputs/tools/qa ../gameplay-inputs/tools/battle_env
          cp pokeemerald-mp-bfxtest ../gameplay-inputs/
          cp tools/qa/gameplay_check.py tools/qa/inventory.py ../gameplay-inputs/tools/qa/
          cp tools/battle_env/mega_check.py ../gameplay-inputs/tools/battle_env/
          python3 tools/qa/gameplay_check.py --exe pokeemerald-mp-bfxtest --kinds "${{ inputs.kinds || 'trainer,item,person,sign,hidden,warp' }}" --plan-only \
            --out ../gameplay-inputs/plan
          shards="${{ inputs.shards || '8' }}"
          [ "$shards" -ge 1 ] && [ "$shards" -le 16 ] || { echo "shards must be 1-16" >&2; exit 1; }
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($shards))))")" >> "$GITHUB_OUTPUT"
          echo "engine_commit=$(git -c safe.directory="$PWD" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Hand the test game and the plan to the shard jobs (private, one day)
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-inputs
          path: gameplay-inputs
          retention-days: 1
          if-no-files-found: error

  shard:
    name: Targets (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - name: Runtime (32-bit SDL2, a virtual display)
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 libsdl2-2.0-0:i386 \
            xvfb xauth
      - uses: actions/download-artifact@v4
        with:
          name: gameplay-inputs
          path: inputs
      - name: A character from the short introduction, then this shard's targets
        shell: bash
        run: |
          chmod +x inputs/pokeemerald-mp-bfxtest
          set +e
          xvfb-run -a -s "-screen 0 1280x800x24" python3 inputs/tools/qa/gameplay_check.py \
            --exe inputs/pokeemerald-mp-bfxtest --plan inputs/plan/plan.json --kinds "${{ inputs.kinds || 'trainer,item,person,sign,hidden,warp' }}" \
            --make-save "$RUNNER_TEMP/new.sav" --shard ${{ matrix.shard }} --shards ${{ inputs.shards || '8' }} \
            --jobs 2 --speed ${{ inputs.speed || '4' }} --out out
          echo "exit=$?" >> "$GITHUB_ENV"
          find out -name test.sav -delete
          find out -name new.sav -delete
      - name: Upload this shard's report (private to this repository, 7 days; no save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-shard-${{ matrix.shard }}
          path: |
            out/gameplay_check.json
            out/**/hang-*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Every target of this shard passed
        run: test "$exit" = 0

  report:
    name: The whole game's report
    needs: [build, shard]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gameplay-shard-*
          path: shards
      - name: Merge the shards
        run: |
          python3 - <<'PY'
          import collections, glob, json
          results, blocked, seconds = [], {}, []
          for path in sorted(glob.glob("shards/*/gameplay_check.json")):
              report = json.load(open(path))
              results += report["results"]
              blocked.update({b["key"]: b for b in report["blocked"]})
              seconds.append(report["seconds"])
          summary = collections.defaultdict(collections.Counter)
          for r in results:
              summary[r["kind"]]["passed" if r["passed"] else "failed"] += 1
          for b in blocked.values():
              summary[b["kind"]]["blocked"] += 1
          merged = dict(engine_commit="${{ needs.build.outputs.engine_commit }}", shards=len(seconds),
                        longest_shard_seconds=max(seconds, default=0), summary=summary, results=results,
                        blocked=list(blocked.values()))
          json.dump(merged, open("gameplay_check.json", "w"), indent=1)
          print(json.dumps(dict(engine_commit=merged["engine_commit"], shards=len(seconds), summary=summary)))
          for r in results:
              if not r["passed"]:
                  print(f"FAILED {r['key']}: {r['reason']}")
          PY
      - name: Upload the merged report (private to this repository, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-check-report
          path: gameplay_check.json
          retention-days: 7
