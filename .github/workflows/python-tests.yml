# Python host/companion test suite.
# NOTE: this repository is not hosted on GitHub yet, so this workflow has not run.
name: python-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Private virtual environment with pinned, hashed dependencies
        run: |
          # Run 811 (2026-11-11): the runner could not resolve its Ubuntu mirror for four minutes and this install failed
          # before any test ran: network timeouts, and three tries a minute apart, the last from Ubuntu's own archive
          # (as the Windows workflow's toolchain does).
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            if [ "$attempt" = 3 ]; then
              for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
                [ -f "$sources" ] || continue
                sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$sources"
              done
            fi
            timeout 300 sudo apt-get update -qq || echo "apt-get update failed (attempt $attempt): on" >&2
            timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q python3-tk xvfb && break
            [ "$attempt" = 3 ] && { echo "apt-get install failed three times" >&2; exit 1; }
            echo "apt-get install failed (attempt $attempt): again in a minute" >&2
            sleep 60
          done
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-host-provisioning.txt
          .venv/bin/python -m pip install pytest==9.1.1 pytest-timeout
      - name: Test suite
        run: xvfb-run -a .venv/bin/python -m pytest
      - name: A real full disk (KNOWN_ISSUES MS-214 and MS-215), an 8 MB tmpfs of its own
        # tests/test_real_full_disk.py fills a volume of its own to its last byte and frees it again (skipped in the
        # suite above, which has no such volume); the Windows run repeats it on NTFS. All three must pass: none skipped.
        if: ${{ always() }}
        run: |
          sudo mkdir -p /mnt/full-disk
          sudo mount -t tmpfs -o size=8m,uid=$(id -u),gid=$(id -g) tmpfs /mnt/full-disk
          EMERALD_FULL_DISK_DIR=/mnt/full-disk/full .venv/bin/python -m pytest tests/test_real_full_disk.py -s -v -rfEs \
            -p no:cacheprovider | tee full-disk.log
          grep -q "3 passed" full-disk.log && ! grep -qi "skipped" full-disk.log
