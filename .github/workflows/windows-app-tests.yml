# The app's whole Python test suite on Windows: the same tests python-tests runs on Linux (the launcher, the world
# server, the companion, the saves, the protocols), on a GitHub-hosted windows-2022 runner (not a player's PC) with
# Windows' own files, locks, processes, sockets and paths, and the Python the Windows jobs use. No game, no ROM and no
# secret: the tests' own synthetic data. Started by hand; windows-package's world-loading job runs the save path's own
# tests on every Windows run.
name: windows-app-tests

on:
  workflow_dispatch:
    inputs:
      select:
        description: "pytest's -k expression (blank: every test)"
        default: ""

jobs:
  pytest-windows:
    name: The app's tests on Windows
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Private virtual environment with the pinned, hashed wheels, and the test runner
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --require-hashes --only-binary=:all: -r requirements-host-provisioning.txt
          .venv/Scripts/python -m pip install pytest==9.1.1 pytest-timeout
      - name: The test suite (pytest.ini's settings; every failure listed at the end)
        env:
          SELECT: ${{ inputs.select }}
        run: |
          args=(-rfE --junitxml="$RUNNER_TEMP/pytest-windows.xml")
          [ -n "$SELECT" ] && args+=(-k "$SELECT")
          .venv/Scripts/python -m pytest "${args[@]}"
      - name: Upload the results (private to this repository, 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldTogether-windows-app-tests
          path: ${{ runner.temp }}/pytest-windows.xml
          retention-days: 7
          if-no-files-found: warn
